<head>

    <style>
        * {

        body {

            background: white;

        .logo {
            font-size: 55px;

            font-size: 18px;

        .btn-iniciar {
            background: #46178f;

            border-radius: 12px;

        .btn-iniciar:hover {
            transform: scale(1.05);

            display: flex;

            background: #e91e63;

            display: grid;

            gap: 15px;

        .opcao {
            padding: 20px;

        .opcao:nth-child(1) {
            background: #e21b3c;
        }

        .opcao:nth-child(2) {
            background: #1368ce;

        .opcao:nth-child(3) {
            background: #d89e00;
        }

        .opcao:nth-child(4) {
            background: #26890c;

        .opcao:hover {
            transform: scale(1.03);
            filter: brightness(1.1);
        }

        .opcao:disabled {
            cursor: not-allowed;
        }

        .resultado {
            display: none;
        }

        .pontuacao {
            font-size: 60px;

            color: #46178f;

        .mensagem {

        .explicacao {

        }

        .proxima {
            margin-top: 20px;

            padding: 15px 35px;

        }

        .proxima:hover {
            background: #35106e;
        }

        .barra-container {
            width: 100%;

        }

        .barra {
            height: 100%;

            background: #46178f;
            transition: width 0.1s linear;
        }

        .aviso {
            margin-top: 25px;
            font-size: 13px;
            color: #777;
        }

        @media (max-width: 650px) {
            .tela {
                padding: 25px 18px;
            }

                font-size: 32px;
            }

            .opcoes {

<body>

<div class="container">

    <!-- TELA INICIAL -->
    <div class="tela" id="inicio">

        <div class="logo">🎯</div>

        <h1>BETS BRASIL</h1>

        <p class="subtitulo">
            Você conhece as regras das apostas esportivas no Brasil?
            Teste seus conhecimentos!
        </p>

        <button class="btn-iniciar" onclick="iniciarJogo()">
            🚀 COMEÇAR
        </button>

        <p class="aviso">
            Quiz educativo sobre apostas e legislação brasileira.
        </p>

    </div>


    <!-- TELA DO QUIZ -->
    <div class="tela" id="quiz" style="display:none;">

        <div class="topo">

            <div class="contador">
                Pergunta <span id="numero">1</span>/<span id="total">10</span>
            </div>

            <div class="tempo">
                ⏱️ <span id="tempo">15</span>s
            </div>

        </div>

        <div class="barra-container">
            <div class="barra" id="barra"></div>
        </div>

        <div class="pergunta">
            <h2 id="textoPergunta"></h2>
        </div>

        <div class="opcoes" id="opcoes"></div>

        <div id="explicacao" class="explicacao" style="display:none;"></div>

        <button
            class="proxima"
            id="botaoProxima"
            onclick="proximaPergunta()"
            style="display:none;">
            Próxima pergunta →
        </button>

    </div>


    <!-- RESULTADO -->
    <div class="tela resultado" id="resultado">

        <div class="logo">🏆</div>

        <h1>Fim do jogo!</h1>

        <p>Você fez:</p>

        <div class="pontuacao">
            <span id="pontuacaoFinal">0</span>/10
        </div>

        <div class="mensagem" id="mensagemFinal"></div>

        <button class="btn-iniciar" onclick="reiniciarJogo()">
            🔄 JOGAR NOVAMENTE
        </button>

    </div>

</div>


<script>

const perguntas = [

    {
        pergunta: "O que são as chamadas 'bets'?",
        opcoes: [
            "Aplicativos de música",
            "Apostas, geralmente relacionadas a eventos esportivos",
            "Programas de televisão",
            "Jogos educativos"
        ],
        correta: 1,
        explicacao: "Bets são plataformas de apostas. No Brasil, as apostas de quota fixa passaram a ter regras específicas de regulamentação."
    },

    {
        pergunta: "Qual é o principal objetivo da regulamentação das bets?",
        opcoes: [
            "Incentivar crianças a apostar",
            "Eliminar todos os esportes",
            "Estabelecer regras e mecanismos de controle",
            "Permitir apostas sem qualquer fiscalização"
        ],
        correta: 2,
        explicacao: "A regulamentação busca estabelecer regras para o funcionamento das empresas, fiscalização e medidas de proteção aos apostadores."
    },

    {
        pergunta: "Menores de 18 anos podem apostar legalmente?",
        opcoes: [
            "Sim",
            "Somente aos finais de semana",
            "Somente com autorização dos pais",
            "Não"
        ],
        correta: 3,
        explicacao: "A legislação brasileira proíbe a participação de menores de 18 anos em apostas de quota fixa."
    },

    {
        pergunta: "Qual destas práticas representa um risco relacionado às apostas?",
        opcoes: [
            "Apostar dinheiro que você não pode perder",
            "Estudar as regras",
            "Conhecer os riscos",
            "Definir limites"
        ],
        correta: 0,
        explicacao: "Apostar dinheiro que é necessário para despesas pessoais pode causar problemas financeiros."
    },

    {
        pergunta: "As bets podem ser divulgadas livremente para qualquer público?",
        opcoes: [
            "Sim, inclusive para crianças",
            "Não existem regras de publicidade",
            "Existem regras e restrições para publicidade",
            "Somente durante a madrugada"
        ],
        correta: 2,
        explicacao: "A publicidade de apostas está sujeita a regras, incluindo medidas relacionadas à proteção de menores e ao jogo responsável."
    },

    {
        pergunta: "O que significa 'jogo responsável'?",
        opcoes: [
            "Apostar o máximo possível",
            "Apostar sem estabelecer limites",
            "Adotar comportamentos para reduzir riscos e controlar os gastos",
            "Pedir dinheiro emprestado para apostar"
        ],
        correta: 2,
        explicacao: "Jogo responsável envolve reconhecer os riscos, estabelecer limites e evitar comprometer dinheiro necessário para outras despesas."
    },

    {
        pergunta: "Qual é uma possível consequência financeira do excesso de apostas?",
        opcoes: [
            "Aumento garantido da renda",
            "Dívidas e perda de dinheiro",
            "Salário maior",
            "Investimento garantido"
        ],
        correta: 1,
        explicacao: "Apostas não garantem lucro. O excesso pode causar perdas financeiras e endividamento."
    },

    {
        pergunta: "Uma aposta esportiva pode garantir lucro?",
        opcoes: [
            "Sim, sempre",
            "Sim, se apostar muito",
            "Não",
            "Somente em finais de campeonato"
        ],
        correta: 2,
        explicacao: "Não existe garantia de lucro em apostas esportivas. O resultado envolve risco e pode gerar perdas."
    },

    {
        pergunta: "Por que existem regras para empresas de apostas?",
        opcoes: [
            "Para permitir qualquer prática",
            "Para estabelecer requisitos e fiscalização",
            "Para acabar com todos os esportes",
            "Para obrigar as pessoas a apostar"
        ],
        correta: 1,
        explicacao: "As regras estabelecem requisitos para empresas que atuam no setor e mecanismos de fiscalização e proteção."
    },

    {
        pergunta: "Qual atitude é mais segura diante das apostas?",
        opcoes: [
            "Apostar dinheiro destinado às contas",
            "Apostar para tentar recuperar perdas",
            "Ignorar os riscos",
            "Conhecer as regras e evitar comprometer dinheiro necessário"
        ],
        correta: 3,
        explicacao: "Conhecer os riscos e não comprometer dinheiro necessário para despesas são atitudes importantes para reduzir danos."
    }

];


let perguntaAtual = 0;
let pontos = 0;
let tempo = 15;
let intervalo;


function iniciarJogo() {

    document.getElementById("inicio").style.display = "none";
    document.getElementById("quiz").style.display = "block";

    document.getElementById("total").textContent = perguntas.length;

    mostrarPergunta();
}


function mostrarPergunta() {

    clearInterval(intervalo);

    const pergunta = perguntas[perguntaAtual];

    document.getElementById("numero").textContent =
        perguntaAtual + 1;

    document.getElementById("textoPergunta").textContent =
        pergunta.pergunta;

    const opcoes = document.getElementById("opcoes");

    opcoes.innerHTML = "";

    document.getElementById("explicacao").style.display = "none";

    document.getElementById("botaoProxima").style.display = "none";

    pergunta.opcoes.forEach((opcao, indice) => {

        const botao = document.createElement("button");

        botao.classList.add("opcao");

        botao.textContent = opcao;

        botao.onclick = () => responder(indice);

        opcoes.appendChild(botao);

    });

    iniciarTempo();
}


function iniciarTempo() {

    tempo = 15;

    document.getElementById("tempo").textContent = tempo;

    document.getElementById("barra").style.width = "100%";

    intervalo = setInterval(() => {

        tempo--;

        document.getElementById("tempo").textContent = tempo;

        document.getElementById("barra").style.width =
            (tempo / 15 * 100) + "%";

        if (tempo <= 0) {

            clearInterval(intervalo);

            responder(-1);

        }

    }, 1000);
}


function responder(indiceEscolhido) {

    clearInterval(intervalo);

    const pergunta = perguntas[perguntaAtual];

    const botoes =
        document.querySelectorAll(".opcao");

    botoes.forEach(botao => {
        botao.disabled = true;
    });


    if (indiceEscolhido === pergunta.correta) {

        pontos++;

        botoes[indiceEscolhido].style.background = "#2ecc71";

    } else {

        if (indiceEscolhido >= 0) {
            botoes[indiceEscolhido].style.background = "#e74c3c";
        }

        botoes[pergunta.correta].style.background = "#2ecc71";

    }


    const explicacao =
        document.getElementById("explicacao");

    if (indiceEscolhido === -1) {

        explicacao.innerHTML =
            "⏰ <strong>Tempo esgotado!</strong><br><br>" +
            pergunta.explicacao;

    } else if (indiceEscolhido === pergunta.correta) {

        explicacao.innerHTML =
            "✅ <strong>Resposta correta!</strong><br><br>" +
            pergunta.explicacao;

    } else {

        explicacao.innerHTML =
            "❌ <strong>Resposta incorreta.</strong><br><br>" +
            pergunta.explicacao;

    }

    explicacao.style.display = "block";

    document.getElementById("botaoProxima").style.display =
        "inline-block";
}


function proximaPergunta() {

    perguntaAtual++;

    if (perguntaAtual < perguntas.length) {

        mostrarPergunta();

    } else {

        mostrarResultado();

    }

}


function mostrarResultado() {

    document.getElementById("quiz").style.display = "none";

    document.getElementById("resultado").style.display = "block";

    document.getElementById("pontuacaoFinal").textContent = pontos;


    let mensagem;

    if (pontos === 10) {

        mensagem = "🔥 Excelente! Você acertou todas!";

    } else if (pontos >= 7) {

        mensagem = "👏 Muito bom! Você conhece bastante sobre o assunto.";

    } else if (pontos >= 5) {

        mensagem = "👍 Bom trabalho! Ainda dá para aprender mais.";

    } else {

        mensagem = "📚 Continue estudando sobre o assunto!";

    }

    document.getElementById("mensagemFinal").textContent =
        mensagem;

}


function reiniciarJogo() {

    perguntaAtual = 0;
    pontos = 0;

    document.getElementById("resultado").style.display = "none";

    document.getElementById("quiz").style.display = "block";

    mostrarPergunta();

}

</script>

</body>
</html>
